<h1>📷 Paste or Drag Images (Multiple Supported)</h1>

<div id="dropArea" style="border:2px dashed #999; padding:30px; text-align:center;">
    👉 Paste (Ctrl + V) or Drag & Drop Images Here
</div>

<br />

<div id="previewContainer"></div>

<br />

<button onclick="extractAll()">Extract Text From All</button>

<p><b>Status:</b> <span id="status"></span></p>

<textarea id="output" rows="15" style="width:100%;"></textarea>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
    let images = [];

    // 📋 Paste multiple images
    document.addEventListener('paste', function (event) {
        const items = event.clipboardData.items;

        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf("image") !== -1) {
                const file = items[i].getAsFile();
                addImage(file);
            }
        }
    });

    // 🖱️ Drag & Drop multiple
    const dropArea = document.getElementById("dropArea");

    dropArea.addEventListener("dragover", e => e.preventDefault());

    dropArea.addEventListener("drop", e => {
        e.preventDefault();

        const files = e.dataTransfer.files;

        for (let i = 0; i < files.length; i++) {
            if (files[i].type.startsWith("image/")) {
                addImage(files[i]);
            }
        }
    });

    // ➕ Add image + preview
    function addImage(file) {
        images.push(file);

        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.width = 150;
        img.style.margin = "10px";

        document.getElementById("previewContainer").appendChild(img);
    }

    // 🚀 OCR All Images
    async function extractAll() {
        if (images.length === 0) {
            alert("Paste or drop images first!");
            return;
        }

        let finalText = "";

        for (let i = 0; i < images.length; i++) {
            document.getElementById("status").innerText =
                "Processing Image " + (i + 1) + " / " + images.length;

            const result = await Tesseract.recognize(
                images[i],
                'eng',
                {
                    logger: m => {
                        if (m.status === "recognizing text") {
                            document.getElementById("status").innerText =
                                `Image ${i + 1}: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                }
            );

            finalText += "\n\n--- Image " + (i + 1) + " ---\n";
            finalText += result.data.text;
        }

        document.getElementById("output").value = finalText;
        document.getElementById("status").innerText = "Done ✅";
    }
</script>
